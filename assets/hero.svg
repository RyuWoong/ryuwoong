<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RyuWoong — Mobile apps. Thoughtful tools.</title>
  <desc id="desc">Warm amber and copper banner with animated orbital lines.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c1512"/><stop offset="1" stop-color="#442719"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f2b84b" stop-opacity=".3"/><stop offset="1" stop-color="#f2b84b" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#f2b84b"/><stop offset="1" stop-color="#e27a5f"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffe4b5" stroke-opacity=".04"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="1010" cy="150" rx="400" ry="300" fill="url(#glow)"/>
    <g fill="none" stroke="#e7b96b" stroke-opacity=".23">
      <circle cx="1010" cy="180" r="112"/><circle cx="1010" cy="180" r="155"/><circle cx="1010" cy="180" r="204"/>
      <path d="M780 180h460M1010-50v460" stroke-dasharray="3 8"/>
    </g>
    <g transform="translate(1010 180)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
        <circle cx="155" r="7" fill="#f2b84b"/><circle cx="-155" r="4" fill="#e27a5f"/>
      </g>
      <rect x="-65" y="-54" width="130" height="108" rx="22" fill="#241a15" stroke="#b98950"/>
      <text y="15" text-anchor="middle" fill="#f4c575" font-family="monospace" font-size="48" font-weight="700">&lt;/&gt;</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="56" y="40" width="173" height="28" rx="14" fill="#f2b84b" fill-opacity=".12" stroke="#f2b84b" stroke-opacity=".4"/>
      <circle cx="73" cy="54" r="4" fill="#f2b84b"/>
      <text x="86" y="59" font-size="12" fill="#f4c575" letter-spacing="2">BUILDING THINGS</text>
      <text x="54" y="166" font-size="86" font-weight="800" fill="#fff2d2" letter-spacing="-4">RyuWoong<tspan fill="#f2b84b">.</tspan></text>
      <text x="58" y="213" font-size="28" fill="#e8c9a6">Mobile apps. Thoughtful tools.</text>
      <text x="58" y="278" font-size="13" fill="#c59b75" letter-spacing="3">REACT NATIVE / TYPESCRIPT / INDIE MAKER</text>
      <rect x="56" y="311" width="200" height="3" rx="1.5" fill="url(#line)"/>
      <text x="1142" y="328" text-anchor="end" font-size="12" fill="#c59b75" letter-spacing="2">HELLO, WORLD</text>
    </g>
  </g>
</svg>
